<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suizamente</title>
<link rel="icon" href="/favicon.svg">
<meta name="description" content="Suizamente, de Latido: elige, mira qué eligió la comunidad y aprende algo de Suiza en cada pregunta.">
<link rel="stylesheet" href="/suizamente/fonts.css">
<!--
  SUIZAMENTE · implementación de referencia (HTML + CSS + JS sin dependencias).
  - Preguntas: data/preguntas.json
  - Votos de la comunidad: ver «PROVEEDORES DE VOTOS» en el script. En Latido, define antes de este archivo:
      <script>window.SUIZAMENTE_CONFIG = { api: "https://latido.ch/api/suizamente", jugadorId: "<id del usuario si ha iniciado sesión>" }</script>
  - Especificación completa: INTEGRACION.md
-->
<style>
/* Layout: una columna móvil. Pregunta dentro de un «bocadillo» de color (motivo del logo de Latido),
   opciones como pastillas grandes; al elegir, la pantalla entera se tiñe del color de la pregunta. */
:root{
  /* Colores oficiales de Latido */
  --mint:#24E2C9; --sea:#03AA98; --orange:#F9A719; --red:#FA2F35; --blue:#4A76EF; --sky:#24BFE2;
  /* Neutros */
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#0F1A2B; --soft:#5A6577; --line:#E4E8EF; --wash:#F4F7FB;
  --on-dark:#FFFFFF; --on-light:#0F1A2B;
  --font:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-xl:30px; --r-lg:22px; --r-md:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1118; --card:#161C26; --ink:#F2F5F9; --soft:#A2ACBB; --line:#273042; --wash:#121823; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1118; --card:#161C26; --ink:#F2F5F9; --soft:#A2ACBB; --line:#273042; --wash:#121823; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
html,body,.reveal{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.reveal::-webkit-scrollbar{display:none;width:0;height:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding-block:max(14px,env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-height:100%}

/* temas de color por pregunta (fondo + texto legible encima) */
.t-red{--th:var(--red);--on:var(--on-dark)} .t-blue{--th:var(--blue);--on:var(--on-dark)} .t-sea{--th:var(--sea);--on:var(--on-dark)}
.t-orange{--th:var(--orange);--on:var(--on-light)} .t-sky{--th:var(--sky);--on:var(--on-light)} .t-mint{--th:var(--mint);--on:var(--on-light)}

/* logo */
.logo{display:block;width:100%;height:100%;overflow:visible}
.beat{animation:beat 1.6s ease-in-out infinite;transform-origin:52% 48%}

/* inicio */
.home{display:flex;flex-direction:column;gap:14px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding-top:0}
.hero .lg{width:72px;height:72px;margin-bottom:2px}
.hero .kicker{font-size:14px;letter-spacing:0;text-transform:none}
.kicker{margin:0;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.title{margin:0;font-weight:900;font-size:clamp(42px,13vw,60px);line-height:1;letter-spacing:-.035em}
.title .a{color:var(--red)} .title .b{color:var(--blue)}
.lead{margin:5px 0 0;font-weight:500;font-size:16px;line-height:1.4;color:var(--soft);max-width:34ch}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{border-radius:var(--r-lg);padding:12px;background:var(--wash);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;cursor:pointer;transition:transform .18s,border-color .2s,box-shadow .2s}
.mode:hover{transform:translateY(-3px);border-color:var(--mc,var(--blue));box-shadow:0 10px 24px -14px var(--mc,var(--blue))}
.mode:active{transform:scale(.98)}
.mode:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.mode .em{font-size:24px;line-height:1}
.mode b{font-weight:800;font-size:15.5px;line-height:1.2}
.mode .d{font-weight:500;font-size:14px;line-height:1.3;color:var(--soft)}
.mode .go{margin-top:auto;padding-top:6px;display:flex;align-items:center;font-weight:700;font-size:14px;color:var(--soft)}
.mode .go i{font-style:normal;font-weight:800;white-space:nowrap;color:var(--mc,var(--blue))}
.mode.m-dilemas{--mc:var(--blue)} .mode.m-preguntas{--mc:var(--sea)} .mode.m-mix{--mc:var(--red);grid-column:1/-1}
.mode.m-mix .row{display:flex;align-items:center;gap:12px}
@media (max-height:640px){.hero .lg{width:56px;height:56px}.home{gap:12px}}
.stats-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{text-align:center;padding:10px 6px;border-radius:var(--r-md);border:1px solid var(--line)}
.stat b{display:block;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.note{margin:0;font-weight:500;font-size:13px;line-height:1.45;color:var(--soft);text-align:center}
.foot{margin:0;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);text-align:center}
.foot a{color:inherit}

/* botones */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:18px;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform .15s}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.97)}
.btn:focus-visible,.opt:focus-visible,.icon-btn:focus-visible,.skip:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.red{background:var(--red);color:#fff}
.btn.light{background:#fff;color:var(--on-light)}
.btn.line{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* pregunta */
.app.playing{min-height:100dvh;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.question{flex:1;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--wash);display:grid;place-items:center;font-size:20px;font-weight:700;cursor:pointer}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:8px;border-radius:99px;background:var(--line);transition:background .3s}
.prog i.ok{background:var(--sea)} .prog i.ko{background:var(--red)} .prog i.op{background:var(--blue)} .prog i.now{background:var(--ink)} .prog i.sk{background:var(--soft)}
.skip{border:0;background:none;font-weight:700;font-size:14px;color:var(--soft);cursor:pointer;padding:8px 4px}
.bubble{position:relative;background:var(--th);color:var(--on);border-radius:var(--r-xl) var(--r-xl) var(--r-xl) 10px;padding:14px 16px 18px;margin:6px 0 10px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
.bubble::after{content:"";position:absolute;left:18px;bottom:-16px;width:30px;height:30px;background:var(--th);clip-path:polygon(0 0,100% 0,0 100%);border-bottom-left-radius:6px}
.kind{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;max-width:calc(100% - 36px);padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--on) 16%,transparent);font-weight:700;font-size:11.5px;line-height:1.3;letter-spacing:.035em;text-transform:uppercase}
.q{margin:0;font-weight:800;font-size:clamp(21px,6vw,27px);line-height:1.16;letter-spacing:-.015em;text-wrap:balance}
.q-em{position:absolute;right:12px;top:-18px;width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:27px;box-shadow:0 0 0 4px var(--th)}
.opts{flex:1;display:grid;grid-auto-rows:minmax(min-content,1fr);gap:12px}
.opts.with-or{grid-template-rows:minmax(min-content,1fr) 28px minmax(min-content,1fr);gap:8px}
.opt{--oc:var(--blue);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;min-height:104px;padding:12px 16px;border-radius:var(--r-lg);border:2.5px solid color-mix(in srgb,var(--oc) 55%,var(--line));background:var(--card);text-align:center;cursor:pointer;font-weight:700;font-size:17px;line-height:1.3;transition:transform .18s,background .2s,border-color .2s}
.opt:hover{border-color:var(--oc);transform:translateY(-2px)}
.opt:active{transform:scale(.98)}
.opt .oe{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--oc) 22%,var(--card))}
.opts:not(.with-or) .oe{width:38px;height:38px;font-size:23px}
.opt .ot{min-width:0;max-width:32ch}
.opt.o1{--oc:var(--blue)} .opt.o2{--oc:var(--orange)} .opt.o3{--oc:var(--sky)}
.opt.picked{background:var(--oc);border-color:var(--oc);color:#fff}
.opt.o2.picked,.opt.o3.picked{color:var(--on-light)}
.opt.picked .oe{background:rgba(255,255,255,.35)}
.vs{display:grid;place-items:center;font-weight:800;font-size:16px;line-height:1;color:var(--soft)}

/* resultado a pantalla completa */
.reveal{position:fixed;inset:0;z-index:40;background:var(--th);color:var(--on);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.reveal.anim{animation:reveal .55s cubic-bezier(.2,.8,.2,1) both}
.rv{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.rv-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:8px}
.rv-em{font-size:58px;line-height:1;animation:pop .6s .25s both}
.rv-h{margin:0;font-weight:900;font-size:clamp(28px,8.4vw,38px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.rv-sub{margin:0;font-weight:600;font-size:15.5px;line-height:1.4;opacity:.92;max-width:34ch}
.panel{background:var(--card);color:var(--ink);border-radius:var(--r-xl);padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.res{position:relative;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;border-radius:var(--r-lg);padding:16px 12px 12px}
.res.is-picked{border-color:var(--oc)}
.res-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.res-t{font-weight:700;font-size:15px;line-height:1.3;min-width:0}
.res-p{font-weight:900;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;flex:none}
.res-bar{height:14px;border-radius:99px;background:var(--wash);overflow:hidden}
.res-bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--oc);transition:width 1.1s cubic-bezier(.2,.9,.25,1)}
.res.o1{--oc:var(--blue)} .res.o2{--oc:var(--orange)} .res.o3{--oc:var(--sky)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-weight:700;font-size:11.5px;letter-spacing:.04em;background:var(--wash);color:var(--ink)}
.tag.true{background:color-mix(in srgb,var(--sea) 22%,var(--card));color:var(--ink)}
.tag.mine{position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);background:var(--oc);color:#fff;white-space:nowrap;padding:4px 12px;font-size:12px}
.res.o2 .tag.mine,.res.o3 .tag.mine{color:var(--on-light)}
.votes{margin:0;font-weight:600;font-size:12.5px;color:var(--soft)}
.answer-fact{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.answer-fact b{font-size:14px;font-weight:800}
.answer-fact p{margin:0;font-size:15.5px;font-weight:500;line-height:1.5}
.copymsg{margin:0;min-height:1.2em;text-align:center;font-weight:600;font-size:13.5px}
textarea.copybox{width:100%;min-height:90px;border-radius:14px;border:2px solid var(--line);padding:10px;font:500 14px/1.4 var(--font);background:var(--card);color:var(--ink)}

/* final de ronda */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:10px}
.done .lg{width:104px;height:104px}
.big{margin:0;font-weight:900;font-size:clamp(32px,9.6vw,44px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;width:100%}
.score div{border-radius:var(--r-lg);padding:14px 10px;text-align:center;background:var(--wash);border:1px solid var(--line)}
.score b{display:block;font-weight:900;font-size:30px;font-variant-numeric:tabular-nums}
.score span{font-weight:600;font-size:13px;line-height:1.3;color:var(--soft)}
.squares{font-size:26px;letter-spacing:2px;line-height:1.2}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:20vh;text-align:center}
.loading .lg{width:90px;height:90px}

@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.08)}28%{transform:scale(.97)}42%{transform:scale(1.05)}60%{transform:scale(1)}}
@keyframes reveal{from{clip-path:circle(0 at var(--x,50%) var(--y,60%))}to{clip-path:circle(150% at var(--x,50%) var(--y,60%))}}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(6deg);opacity:1}100%{transform:none}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.in{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app"><div class="loading"><p class="kicker">Latido</p><p class="title"><span class="a">Suiza</span><span class="b">mente</span></p><p class="note">Cargando preguntas…</p></div></div>
<div id="layer"></div>

<script src="/suizamente/votos.js"></script>
<script src="/suizamente/juego.js"></script>
</body>
</html>
